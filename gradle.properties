org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
# Applique strictement les règles keep en R8 full mode (moins de membres
# conservés implicitement, donc plus d'optimisation).
android.r8.strictFullModeForKeepRules=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false